ll="#f3f0fa" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="128" y="1066" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#111111" text-anchor="start">api/main.py:9</text><g transform="rotate(0 390.5 1056.5)"><rect x="314" y="1044" width="161" height="33" rx="16.5" fill="#111111"/><rect x="310" y="1040" width="161" height="33" rx="16.5" fill="#c9f07a" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="390.5" y="1061.18" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.5">SOURCE CONFIRMED</text></g><rect x="128" y="1096" width="1184" height="252" rx="14" fill="#0c0b10" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="152" y="1138" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#f28b9e" text-anchor="start">-</text><text xml:space="preserve" x="180" y="1138" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#f28b9e" text-anchor="start">def create_order(sku: str = Body(...), qty: int = Body(1)):</text><text xml:space="preserve" x="152" y="1168" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#c9f07a" text-anchor="start">+</text><text xml:space="preserve" x="180" y="1168" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#c9f07a" text-anchor="start">def create_order(sku: str = Body(...), qty: Optional[int] = Body(1)):</text><text xml:space="preserve" x="152" y="1198" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#bdb6ea" text-anchor="start"> </text><text xml:space="preserve" x="180" y="1198" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#bdb6ea" text-anchor="start">    &quot;&quot;&quot;Create an order. A null quantity means one unit.&quot;&quot;&quot;</text><text xml:space="preserve" x="152" y="1228" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#c9f07a" text-anchor="start">+</text><text xml:space="preserve" x="180" y="1228" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#c9f07a" text-anchor="start">    # newer FastAPI validates an explicit JSON null against the type</text><text xml:space="preserve" x="152" y="1258" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#c9f07a" text-anchor="start">+</text><text xml:space="preserve" x="180" y="1258" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#c9f07a" text-anchor="start">    if qty is None:</text><text xml:space="preserve" x="152" y="1288" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#c9f07a" text-anchor="start">+</text><text xml:space="preserve" x="180" y="1288" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#c9f07a" text-anchor="start">        qty = 1</text><text xml:space="preserve" x="152" y="1318" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#bdb6ea" text-anchor="start"> </text><text xml:space="preserve" x="180" y="1318" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#bdb6ea" text-anchor="start">    order = {&quot;id&quot;: len(ORDERS) + 1, &quot;sku&quot;: sku, &quot;qty&quot;: qty}</text><text xml:space="preserve" x="128" y="1392" font-family="Bricolage Grotesque" font-size="21" font-weight="600" fill="#111111" text-anchor="start">An explicit JSON null for a field with a default is no longer replaced by the default.</text><text xml:space="preserve" x="128" y="1424" font-family="Bricolage Grotesque" font-size="18" font-weight="400" fill="#24222e" text-anchor="start">It is validated against the type and rejected with a 422. Found by testing the docstring’s intent in the sandbox.</text><rect x="128" y="1452" width="1184" height="112" rx="14" fill="#c9c2ff" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="156" y="1502" font-family="Instrument Serif" font-size="28" font-weight="400" fill="#111111" text-anchor="start" font-style="italic">“Clients that used null to request a default should omit the value instead.”</text><text xml:space="preserve" x="156" y="1538" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#24222e" text-anchor="start">fastapi.tiangolo.com/release-notes  ·  quote verified word for word</text><rect x="102" y="1678" width="1248" height="128" rx="22" fill="#111111"/><rect x="96" y="1672" width="1248" height="128" rx="22" fill="#f3f0fa" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="128" y="1722" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#111111" text-anchor="start">tests/test_upgrade_null_quantity.py</text><g transform="rotate(0 661.0 1712.5)"><rect x="564" y="1700" width="202" height="33" rx="16.5" fill="#111111"/><rect x="560" y="1696" width="202" height="33" rx="16.5" fill="#9fd8f0" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="661.0" y="1717.18" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.5">REGRESSION TEST ADDED</text></g><text xml:space="preserve" x="128" y="1764" font-family="Bricolage Grotesque" font-size="18" font-weight="400" fill="#24222e" text-anchor="start">Pins the documented behaviour: tablets send null for “not filled in”, and that must mean one unit.</text><rect x="102" y="1870" width="600" height="84" rx="42" fill="#111111"/><rect x="96" y="1864" width="600" height="84" rx="42" fill="#f7d774" stroke="#111111" stroke-width="2.5"/><text xml:space="preserve" x="396" y="1917" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="1">VIEW PULL REQUEST  →</text><text xml:space="preserve" x="1344" y="1914" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#24222e" text-anchor="end">fix: Claude Opus 5.5  ·  verify: Claude Sonnet 5.5 + Linkup  ·  store: Databricks</text></svg>